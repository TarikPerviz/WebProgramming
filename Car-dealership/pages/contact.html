<section class="section" id="contact-us" style="margin-top: 0">
  <div class="container-fluid">
    <div class="row">
      <div class="col-lg-6 col-md-6 col-xs-12">
        <div id="map">
          <iframe
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3107.8381448517366!2d18.314697021011497!3d43.81879855968285!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x4758ca0f99d6bf3b%3A0x6f97362d8c61c461!2sInternational%20Burch%20University!5e0!3m2!1sen!2sba!4v1709755411976!5m2!1sen!2sba"
            width="100%"
            height="681.96px"
            frameborder="0"
            style="border: 0"
            allowfullscreen
          ></iframe>
        </div>
      </div>
      <div class="col-lg-6 col-md-6 col-xs-12">
        <div
          class="contact-form section-bg"
          style="background-image: url(assets/images/contact-1-720x480.jpg)"
        >
          <form class="contact-form" id="contact-form" method="post">
            <div class="row">
              <div class="col-md-6 col-sm-12">
                <input
                  type="text"
                  class="form-control"
                  id="name"
                  name="name"
                  placeholder="Your Name"
                  required="true"
                />
              </div>
              <div class="col-md-6 col-sm-12">
                <input
                  type="email"
                  class="form-control"
                  id="email"
                  name="email"
                  placeholder="Your Email"
                  required="true"
                />
              </div>
              <div class="col-md-12 col-sm-12">
                <input
                  type="text"
                  class="form-control"
                  id="subject"
                  name="subject"
                  placeholder="Subject"
                  required="true"
                />
              </div>
              <div class="col-lg-12">
                <textarea
                  class="form-control"
                  name="message"
                  rows="6"
                  id="message"
                  placeholder="Message"
                  required="true"
                ></textarea>
              </div>
              <div class="col-lg-12 form-group">
                <button
                  type="submit"
                  class="form-control btn btn-primary rounded submit px-3"
                >
                  Send Message
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>

<script>
  FormValidation.validate("#contact-form", {}, function (data) {
    $.post(Constants.API_BASE_URL + "contacts/add", data)
      .done(function (data) {
        toastr.success("Question sent!");
      })
      .fail(function (xhr, textStatus, errorThrown) {
        toastr.error("Error: " + errorThrown);
      });
  });
</script>
