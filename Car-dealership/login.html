<!doctype html>
<html lang="en">
  <head>
  	<title>CarDealership.com | The best car dealership</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

	<link href="https://fonts.googleapis.com/css?family=Lato:300,400,700&display=swap" rel="stylesheet">

	<link rel="stylesheet" type="text/css" href="assets/css/bootstrap.min.css">

    <link rel="stylesheet" type="text/css" href="assets/css/font-awesome.css">
    <link rel="stylesheet" href="assets/css/spapp.css">
    <link rel="stylesheet" href="assets/css/style.css">
	<link rel="stylesheet" href="assets/css/style2.css">
	<link rel="stylesheet" href="assets/css/toastr.min.css">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	</head>
	<body>
		<header class="header-area header-sticky" style="background-image: url(assets/images/bg_header_login.jpg)">
			<div class="container">
				<div class="row">
					<div class="col-12">
						<nav class="main-nav">
							<!-- ***** Logo Start ***** -->
							<a href="index.html#home" class="logo">Car Dealership<em> Tarik</em></a>
							<!-- ***** Logo End ***** -->
							<!-- ***** Menu Start ***** -->
							<ul class="nav">
								<li><a href="index.html#home" class="active">Home</a></li>
								<li><a href="login.html">Login</a></li>
							</ul>        
							<a class='menu-trigger'>
								<span>Menu</span>
							</a>
							<!-- ***** Menu End ***** -->
						</nav>
					</div>
				</div>
			</div>
		</header>
		<div class="main-banner" id="top">

		</div>
	<section class="ftco-section">
		<div class="container">
			
			<div class="row justify-content-center">
				<div class="col-md-12 col-lg-10">
					<div class="wrap d-md-flex">
						<div class="img" style="background-image: url(assets/images/bg-1.jpg);">
			      	</div>
						<div class="login-wrap p-4 p-md-5">
			      	<div class="d-flex">
			      		<div class="w-100">
			      			<h3 class="mb-4">Sign In</h3>
			      		</div>	
								
			      	</div>
				 <form class="signin-form" id="signin-form" method="post">
			      		<div class="form-group mb-3">
			      			<label class="label" for="name">Username</label>
			      			<input type="text" class="form-control" id="username" name="username" placeholder="Username" required="true">
			      		</div>
		            <div class="form-group mb-3">
		            	<label class="label" for="password">Password</label>
		              <input type="password" class="form-control" id="password" name="password" placeholder="Password" required="true">
		            </div>
		            <div class="form-group">
		            	<button type="submit" class="form-control btn btn-primary rounded submit px-3">Sign In</button>
						<br>
						<br>
						<button 
							type="button" 
							class="form-control btn btn-primary rounded submit px-3" 
							data-bs-toggle="modal" 
							data-bs-target="#add-user-modal" 
							>Register</button>
						
		            </div>
		            <div class="form-group d-md-flex">
		            	<div class="w-50 text-left">
			            	<label class="checkbox-wrap checkbox-primary mb-0">Remember Me
								<input type="checkbox" checked>
								<span class="checkmark"></span>
							</label>
						</div>
									
		            </div>
		         </form>
		          
		        </div>
		      </div>
				</div>
			</div>
			
		</div>
		<div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
			<div
			  id="success-toast"
			  class="toast hide"
			  role="alert"
			  aria-live="assertive"
			  aria-atomic="true"
			>
			  <div class="toast-header">
				<img src="" class="rounded me-2" alt="" />
				<strong class="me-auto" id="toast-status">SUCCESS</strong>
				<small id="toast-status-code">200</small>
				<button
				  type="button"
				  class="btn-close"
				  data-bs-dismiss="toast"
				  aria-label="Close"
				></button>
			  </div>
			  <div class="toast-body" id="toast-description"></div>
			</div>
		</div>
		
	</section>


<div class="modal fade" id="add-user-modal" tabindex="-1" aria-labelledby="add-user-label" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
		<form id="add-user-form">
      <div class="modal-header">
        <h5 class="modal-title" id="add-user-label">Registration</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        
          <div class="mb-3">
            <label for="username" class="col-form-label">Username</label>
            <input type="text" class="form-control" name="username" id="new_username" required="true">
          </div>
		  <div class="mb-3">
            <label for="password" class="col-form-label">Password</label>
            <input type="text" class="form-control" name="password" id="new_password" required="true">
          </div>
		  <div class="mb-3">	
            <label for="email" class="col-form-label">email</label>  
			<input type="email" class="form-control"  id="email" name="email" required="true">
          </div>
      </div>
      <div class="modal-footer">
        <button type="cancel" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button type="submit" class="btn btn-primary">Register</button>
	  </form>
      </div>
    </div>
  </div>
</div>
	
	

	<script src="assets/js/jquery.min.js"></script>
 	<script src="assets/js/popper.js"></script>
  	<script src="assets/js/bootstrap.min.js"></script>
  	<script src="assets/js/main.js"></script>
	<script src="assets/js/toastr.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.19.2/jquery.validate.min.js"></script>
	<script src="utils/form_validation.js"></script>
	<script src="utils/rest_client.js"></script>
	<script src="utils/constants.js"></script>
	
	<script>
		FormValidation.validate("#signin-form",
		{},
		function(data){
			console.log("Data from form is serialized into",data);
		}
	);
		FormValidation.validate("#add-user-form",
		{},
		function(data){
			$('#add-user-modal button[type="cancel"]').trigger("click");

			$.post(Constants.API_BASE_URL + "users/add", data)
			.done(function(data){
				$("#add-user-modal").modal("toggle");
				toastr.success("User added successfully!");
			}).fail(function(xhr, textStatus, errorThrown) {
            
            toastr.error("Error: " + errorThrown); 
        	});
		}
	);
	</script>
	</body>
</html>
